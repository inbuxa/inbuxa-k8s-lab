# Mode B: an external load balancer (HAProxy in the lab) sends PROXY v2 to a
# listener that trusts PROXY headers from the load balancer's own address
# only. externalTrafficPolicy Local keeps that address visible: with the
# default Cluster policy, SNAT makes every peer look like a node, so trusting
# nodes lets anyone who reaches the port forge a client address (spike S6).
apiVersion: v1
kind: Service
metadata: {name: inbuxa-mail-proxy, namespace: inbuxa}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector: {app: inbuxa-server}
  ports:
    - {name: smtp-proxy, port: 10025, targetPort: 10025}
