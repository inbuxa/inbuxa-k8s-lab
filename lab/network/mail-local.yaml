# Mode A: the load balancer sends traffic only to nodes running a server pod
# and keeps the client's address (no SNAT). No PROXY protocol involved.
apiVersion: v1
kind: Service
metadata: {name: inbuxa-mail-local, namespace: inbuxa}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector: {app: inbuxa-server}
  ports:
    - {name: smtp, port: 25, targetPort: 25}
    - {name: submissions, port: 465, targetPort: 465}
    - {name: imaps, port: 993, targetPort: 993}
